<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>таблиця</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #000;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
    <main>
        <!-- Тег <table>: створення таблиці -->
        <table>
            <!-- Тег <caption>: заголовок таблиці -->
            <caption>Розклад занять</caption>

            <!-- Тег <thead>: заголовки стовпців -->
            <thead>
            <tr>
                <!-- Тег <th>: заголовочні клітинки -->
                <th>День</th>
                <th>Час</th>
                <th>Предмет</th>
            </tr>
            </thead>

            <!-- Тег <tbody>: основна частина таблиці -->
            <tbody>
            <tr>
                <!-- Тег <td>: звичайна клітинка -->
                <td>Понеділок</td>
                <td>08:30</td>
                <td>Математика</td>
            </tr>
            <tr>
                <td>Вівторок</td>
                <td>10:10</td>
                <td>Інформатика</td>
            </tr>
            <tr>
                <td>Середа</td>
                <td>11:50</td>
                <td>Фізика</td>
            </tr>
            </tbody>

            <!-- Тег <tfoot>: нижній підсумковий рядок -->
            <tfoot>
            <tr>
                <td colspan="3">Тижневий розклад занять</td>
            </tr>
            </tfoot>
        </table>

    </main>
</body>
</html>
