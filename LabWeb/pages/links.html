<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>посилання</title>
    <style>
        main{
            padding: 20px;
            margin: 10px;
            border: 1px solid #fa0000;
            border-radius: 5px;
            width: 400px;
            position: relative;
            background: #ccc4ea;
        }
        main p {
            font-size: 24px;
        }
    </style>
</head>
<body>
<main>
    <!-- Посилання з атрибутом href -->
    <p>
        <!-- Атрибут href вказує адресу переходу -->
        <a href="https://uk.wikipedia.org" target="_blank">Перейти на Вікіпедію</a>
    </p>

    <!-- Посилання з атрибутом target="_blank" відкриває у новій вкладці -->
    <p>
        <!-- Атрибут target="_blank" відкриває посилання в новій вкладці -->
        <a href="https://www.google.com" target="_blank">Відкрити Google у новій вкладці</a>
    </p>

    <!-- Посилання з атрибутом download для завантаження файлу -->
    <p>
        <!-- Атрибут download дозволяє завантажити файл, а не відкривати його -->
        <a href="/tea.png" download>Файл до завантаження</a>
    </p>
</main>
</body>
</html>
